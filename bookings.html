<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Bookings - R S Hospital</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #eef2ff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #2d3e50;
    }
    .stamp {
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
      color: #555;
    }
    .count-box {
      text-align: center;
      background: #4f46e5;
      color: white;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .booking-list {
      max-width: 800px;
      margin: auto;
    }
    .booking-card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .booking-card h3 {
      margin-top: 0;
      color: #2d3e50;
    }
    button {
      background: #4f46e5;
      color: white;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #3730a3;
    }
  </style>
</head>
<body>
  <div class="stamp">🏥 R S Hospital</div>
  <h1>My Appointments</h1>

  <div class="count-box">
    Total Appointments: <span id="count">0</span>
  </div>

  <div class="booking-list" id="bookingList"></div>

  <script>
    // Get stored appointments (from profile/appointment/op-sheet pages)
    let appointments = JSON.parse(localStorage.getItem("appointments")) || [];

    // Update total count
    document.getElementById("count").textContent = appointments.length;

    // Display each booking
    let list = document.getElementById("bookingList");
    appointments.forEach((appt, index) => {
      let card = document.createElement("div");
      card.className = "booking-card";
      card.innerHTML = `
        <h3>Outpatient Department - OP Sheet</h3>
        <p><b>Name:</b> ${appt.name}</p>
        <p><b>Gender:</b> ${appt.gender}</p>
        <p><b>Age:</b> ${appt.age}</p>
        <p><b>Phone:</b> ${appt.phone}</p>
        <p><b>Email:</b> ${appt.email}</p>
        <p><b>Address:</b> ${appt.address}</p>
        <hr>
        <p><b>Problem:</b> ${appt.problem}</p>
        <p><b>Department:</b> ${appt.department}</p>
        <p><b>Ward:</b> ${appt.ward}</p>
        <p><b>Date:</b> ${appt.date}</p>
        <p><b>Slot:</b> ${appt.slot}</p>
        <button onclick="downloadOP(${index})">Download OP Sheet</button>
      `;
      list.appendChild(card);
    });

    // Download OP sheet as text file
    function downloadOP(index) {
      let appt = appointments[index];
      let content = `
🏥 R S Hospital - OP Sheet
-----------------------------
Name: ${appt.name}
Gender: ${appt.gender}
Age: ${appt.age}
Phone: ${appt.phone}
Email: ${appt.email}
Address: ${appt.address}

Problem: ${appt.problem}
Department: ${appt.department}
Ward: ${appt.ward}
Date: ${appt.date}
Slot: ${appt.slot}

Thank you for choosing R S Hospital.
      `;
      let blob = new Blob([content], { type: "text/plain" });
      let link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `OP_Sheet_${appt.date}.txt`;
      link.click();
    }
  </script>
</body>
</html>
