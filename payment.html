<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment with mCoins</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4ff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
    }

    /* Outer wrapper that will get blinking background */
    .background-effect-wrapper {
      padding: 20px;
      border-radius: 20px;
      background-color: transparent;
      transition: background-color 0.3s ease;
      display: inline-block; /* shrink-wrap container */
    }

    .payment-container {
      background: #fff; /* container bg remains white */
      padding: 36px 44px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.15);
      max-width: 420px;
      width: 90%;
      text-align: center;
      animation: fadeIn 0.8s ease forwards;
      position: relative;
      overflow: visible;
      z-index: 10;
    }

    h1 {
      margin-bottom: 20px;
      color: #1e40af;
      font-weight: 700;
      font-size: 2rem;
    }

    p {
      margin: 12px 0;
      font-size: 1.1rem;
      color: #334155;
    }

    .highlight {
      font-weight: 700;
      color: #2563eb;
    }

    .btn {
      padding: 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.3s ease;
      width: 100%;
      font-size: 1.1rem;
      font-weight: 700;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.4);
    }

    .pay-btn {
      background: #16a34a;
      color: white;
    }

    .pay-btn:hover {
      background: #15803d;
      box-shadow: 0 6px 16px rgba(22, 163, 74, 0.7);
    }

    .back-btn {
      background: #e0e7ff;
      color: #1e40af;
      border: 1px solid #c7d2fe;
      box-shadow: none;
      font-weight: 600;
    }

    .back-btn:hover {
      background: #c7d2fe;
    }

    /* New button shown after success */
    #goToOpSheetBtn {
      display: none;
      background: #2563eb;
      color: white;
      margin-top: 30px;
      width: auto;
      padding: 12px 30px;
      font-size: 1.2rem;
      border-radius: 14px;
      box-shadow: 0 5px 15px rgba(37, 99, 235, 0.6);
      cursor: pointer;
      border: none;
      font-weight: 700;
      transition: background-color 0.3s ease;
    }

    #goToOpSheetBtn:hover {
      background-color: #1d4ed8;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Confetti canvas */
    #confetti-canvas {
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      display: none;
    }
  </style>
</head>
<body>
  <div class="background-effect-wrapper" id="backgroundWrapper">
    <div class="payment-container" id="paymentContainer">
      <h1>💰 Pay with mCoins</h1>
      <p>Patient: <span id="patientName" class="highlight"></span></p>
      <p>Current Balance: <span id="walletBalance" class="highlight">0</span> mCoins</p>
      <p>Appointment Fee: <span id="fee" class="highlight">200</span> mCoins</p>

      <button id="payBtn" class="btn pay-btn">✅ Pay & Confirm</button>
      <button class="btn back-btn" onclick="window.location.href='appointment.html'">⬅ Back to Appointment</button>

      <!-- Button shown after success -->
      <button id="goToOpSheetBtn">Go to Operation Sheet</button>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <script>
    const FEE = 200;
    let balance = 0;
    let currentUser;

    const wrapper = document.getElementById('backgroundWrapper');
    const payBtn = document.getElementById('payBtn');
    const goToOpSheetBtn = document.getElementById('goToOpSheetBtn');
    const walletBalanceSpan = document.getElementById('walletBalance');

    // Confetti setup
    const confettiCanvas = document.getElementById("confetti-canvas");
    const ctx = confettiCanvas.getContext("2d");
    let confettiElements = [];
    let confettiAnimationFrame;

    function resizeCanvas() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class ConfettiParticle {
      constructor() {
        this.x = Math.random() * confettiCanvas.width;
        this.y = Math.random() * confettiCanvas.height - confettiCanvas.height;
        this.radius = Math.random() * 6 + 4;
        this.color = `hsl(${Math.floor(Math.random() * 360)}, 70%, 60%)`;
        this.speed = Math.random() * 3 + 2;
        this.tilt = Math.random() * 10 - 10;
        this.tiltSpeed = Math.random() * 0.1 + 0.05;
        this.tiltAngle = 0;
      }

      update() {
        this.y += this.speed;
        this.tiltAngle += this.tiltSpeed;
        this.tilt = Math.sin(this.tiltAngle) * 15;

        if (this.y > confettiCanvas.height) {
          this.y = -10;
          this.x = Math.random() * confettiCanvas.width;
          this.speed = Math.random() * 3 + 2;
        }
      }

      draw() {
        ctx.beginPath();
        ctx.lineWidth = this.radius / 2;
        ctx.strokeStyle = this.color;
        ctx.moveTo(this.x + this.tilt + this.radius / 2, this.y);
        ctx.lineTo(this.x + this.tilt, this.y + this.tilt + this.radius / 2);
        ctx.stroke();
      }
    }

    function createConfetti(num = 100) {
      confettiElements = [];
      for (let i = 0; i < num; i++) {
        confettiElements.push(new ConfettiParticle());
      }
    }

    function runConfetti() {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      confettiElements.forEach((c) => {
        c.update();
        c.draw();
      });
      confettiAnimationFrame = requestAnimationFrame(runConfetti);
    }

    function startConfetti() {
      confettiCanvas.style.display = "block";
      createConfetti(150);
      runConfetti();

      setTimeout(() => {
        confettiCanvas.style.display = "none";
        cancelAnimationFrame(confettiAnimationFrame);
      }, 5000);
    }

    // Blink background on wrapper
    function applyBlinkEffect(color) {
      let visible = true;
      wrapper.style.transition = 'none'; // disable transition for blinking

      const blinkInterval = setInterval(() => {
        wrapper.style.backgroundColor = visible ? color : 'transparent';
        visible = !visible;
      }, 500);

      return blinkInterval;
    }

    function resetBackground() {
      wrapper.style.backgroundColor = 'transparent';
      wrapper.style.transition = 'background-color 0.3s ease';
    }

    // Load current user and balance
    window.onload = function () {
      currentUser = JSON.parse(localStorage.getItem("currentUser"));

      if (!currentUser) {
        alert("You are not logged in! Redirecting...");
        window.location.href = "index.html";
        return;
      }

      balance = parseInt(currentUser.coins || 0);
      document.getElementById("patientName").textContent = currentUser.name || "";
      walletBalanceSpan.textContent = balance;
    };

    // Payment button handler
    payBtn.addEventListener("click", () => {
      if (balance < FEE) {
        // Not enough balance: blink red background 3 seconds
        const failureBlink = applyBlinkEffect('rgba(255, 0, 0, 0.7)');
        setTimeout(() => {
          clearInterval(failureBlink);
          resetBackground();
        }, 3000);
        return;
      }

      // Disable pay button to prevent multiple clicks
      payBtn.disabled = true;

      balance -= FEE;
      currentUser.coins = balance;
      localStorage.setItem("currentUser", JSON.stringify(currentUser));

      // Update users list in localStorage
      let users = JSON.parse(localStorage.getItem("users")) || [];
      users = users.map(u => u.email === currentUser.email ? currentUser : u);
      localStorage.setItem("users", JSON.stringify(users));

      // Save appointment info (if needed)
      const appointment = {
        problem: localStorage.getItem("problem"),
        department: localStorage.getItem("department"),
        ward: localStorage.getItem("ward"),
        date: localStorage.getItem("date"),
        slot: localStorage.getItem("slot"),
        age: localStorage.getItem("age"),
      };
      localStorage.setItem("appointment", JSON.stringify(appointment));

      walletBalanceSpan.textContent = balance;

      // Start confetti and green blinking for 5 seconds
      startConfetti();
      const successBlink = applyBlinkEffect('rgba(22, 163, 74, 0.7)');

      setTimeout(() => {
        clearInterval(successBlink);
        resetBackground();

        // Show button to proceed
        goToOpSheetBtn.style.display = 'inline-block';
      }, 5000);
    });

    // Navigate to op-sheet.html on click
    goToOpSheetBtn.addEventListener("click", () => {
      window.location.href = "op-sheet.html";
    });
  </script>
</body>
</html>
