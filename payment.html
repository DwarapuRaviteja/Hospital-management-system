<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment with mCoins</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .payment-container {
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      max-width: 420px;
      width: 95%;
      animation: fade-in 0.8s ease-in-out;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      color: #111827;
    }

    p {
      margin: 10px 0;
      font-size: 16px;
      color: #374151;
    }

    .highlight {
      font-weight: bold;
      color: #2563eb;
    }

    .btn {
      padding: 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.3s;
      width: 100%;
      font-size: 16px;
    }

    .pay-btn {
      background: #16a34a;
      color: white;
    }

    .pay-btn:hover {
      background: #15803d;
    }

    .back-btn {
      background: #f3f4f6;
      color: #111827;
      border: 1px solid #d1d5db;
    }

    .back-btn:hover {
      background: #e5e7eb;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="wallet-box">
    <h1>💰 Pay with mCoins</h1>
    <p>Patient: <span id="patientName" class="highlight"></span></p>
    <p>Current Balance: <span id="coinBalance" class="highlight"></span> mCoins</p>
    <p>Appointment Fee: <span id="fee" class="highlight">200</span> mCoins</p>

    <button id="payBtn" class="btn pay-btn">✅ Pay & Confirm</button>
    <button class="btn back-btn" onclick="window.location.href='appointment.html'">⬅ Back to Appointment</button>
  </div>
<script>
  const FEE = 200; // Cost per payment

// Safely read wallet and handle missing/invalid user
function getCurrentUser() {
  const raw = localStorage.getItem("currentUser");
  if (!raw) return null;
  try {
    return JSON.parse(raw);
  } catch {
    return null;
  }
}

// Safely update users list after payment
function updateUsersList(currentUser) {
  let users = JSON.parse(localStorage.getItem("users")) || [];
  users = users.map(u => u.email === currentUser.email ? currentUser : u);
  localStorage.setItem("users", JSON.stringify(users));
}

// Perform payment and decrement coins
function makePayment() {
  let currentUser = getCurrentUser();
  if (!currentUser) {
    alert("You are not logged in! Redirecting...");
    window.location.href = "index.html";
    return;
  }
  if (typeof currentUser.coins !== "number" || currentUser.coins < FEE) {
    alert("❌ Not enough coins! Please top-up.");
    return;
  }

  currentUser.coins -= FEE;
  localStorage.setItem("currentUser", JSON.stringify(currentUser));
  updateUsersList(currentUser);

  document.getElementById("coinBalance").textContent = currentUser.coins;
  alert("✅ Payment successful! " + FEE + " coins deducted.");
}

// Use this with your button
document.getElementById("payBtn").addEventListener("click", makePayment);

// Initial balance display
window.onload = function() {
  let currentUser = getCurrentUser();
  if (currentUser && typeof currentUser.coins === "number") {
    document.getElementById("coinBalance").textContent = currentUser.coins;
  }
};
</script>
</body>
</html>
