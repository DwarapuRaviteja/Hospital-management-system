<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Report - City Care Hospitals</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .send-container {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      width: 400px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .send-container h2 {
      margin-bottom: 20px;
      color: #1d4ed8;
    }

    select, input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <div class="title">Send Report</div>

  <div class="send-container">
    <h2>Upload & Send Report</h2>

    <label for="userId">Enter User ID (if known)</label>
    <input type="text" id="userId" placeholder="Enter User ID">

    <label for="recentAppointments">Or select from Approved Appointments</label>
    <select id="recentAppointments">
      <option value="">-- Select Approved Appointment --</option>
    </select>

    <label for="reportFile">Upload Report (PDF/JPG/PNG)</label>
    <input type="file" id="reportFile" accept=".pdf,.jpg,.jpeg,.png">

    <button class="btn" onclick="sendReport()">Send Report</button>
    <p class="error" id="errorMsg">⚠️ Please fill all fields</p>
  </div>

  <!-- Notification -->
  <div id="notification" class="notification">✅ Report Uploaded Successfully!</div>

  <script>
    // Example Approved Appointments (Normally this comes from backend / admin approval)
    if (!localStorage.getItem("approvedAppointments")) {
      const approvedAppointments = [
        { userId: "USER001", name: "John Doe" },
        { userId: "USER002", name: "Sarah Lee" },
        { userId: "USER003", name: "Michael Chen" }
      ];
      localStorage.setItem("approvedAppointments", JSON.stringify(approvedAppointments));
    }

    // Load Approved Appointments into dropdown
    function loadAppointments() {
      const appointments = JSON.parse(localStorage.getItem("approvedAppointments")) || [];
      const dropdown = document.getElementById("recentAppointments");

      appointments.forEach(app => {
        const option = document.createElement("option");
        option.value = app.userId;
        option.textContent = `${app.userId} - ${app.name}`;
        dropdown.appendChild(option);
      });
    }
    loadAppointments();

    // Send Report Function (Multi-report support)
    // Send Report Function (Multi-report support, no redirect)
function sendReport() {
  const userIdInput = document.getElementById("userId").value.trim();
  const selectedAppointment = document.getElementById("recentAppointments").value;
  const fileInput = document.getElementById("reportFile");
  const errorMsg = document.getElementById("errorMsg");
  const notification = document.getElementById("notification");

  const userId = userIdInput || selectedAppointment;
  if (!userId || fileInput.files.length === 0) {
    errorMsg.style.display = "block";
    return;
  } else {
    errorMsg.style.display = "none";
  }

  const file = fileInput.files[0];
  const reader = new FileReader();

  reader.onload = function(e) {
    const reportData = {
      fileName: file.name,
      fileUrl: e.target.result,
      uploadedAt: new Date().toLocaleString()
    };

    // Fetch existing reports for this user
    let reports = JSON.parse(localStorage.getItem("reports_" + userId)) || [];
    reports.push(reportData);

    // Save back to localStorage
    localStorage.setItem("reports_" + userId, JSON.stringify(reports));

    // Show success message only
    notification.classList.add("show");
    setTimeout(() => {
      notification.classList.remove("show");
      // Clear form
      document.getElementById("userId").value = "";
      document.getElementById("recentAppointments").value = "";
      fileInput.value = "";
    }, 2000);
  };

  reader.readAsDataURL(file);
}
  </script>
</body>
</html>
