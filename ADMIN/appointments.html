<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Manage Appointments</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      background: #eef2ff;
      max-width: 1000px;
      margin: auto;
    }
    h1 {
      color: #1e3a8a;
      text-align: center;
    }
    .flex-container {
      display: flex;
      gap: 30px;
      justify-content: space-between;
      margin-top: 30px;
    }
    .box {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 20px;
      width: 48%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .appointment-card {
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      cursor: pointer;
      transition: border-color 0.3s ease;
    }
    .appointment-card:hover {
      border-color: #2563eb;
      background: #f0f4ff;
    }
    .appointment-card.approved {
      border-color: green;
      background: #e6ffe6;
      cursor: default;
    }
    .appointment-header {
      font-weight: 600;
      color: #2563eb;
      margin-bottom: 8px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: 600;
      color: #374151;
    }
    select, button {
      margin-top: 6px;
      padding: 8px;
      width: 100%;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }
    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }
    .doctor-list {
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 5px;
    }
    .doctor-item {
      padding: 6px;
      cursor: pointer;
      border-radius: 4px;
      margin-bottom: 4px;
      transition: background-color 0.2s;
    }
    .doctor-item:hover {
      background-color: #e0e7ff;
    }
    .doctor-item.selected {
      background-color: #2563eb;
      color: white;
    }
    .no-appointments {
      text-align: center;
      color: #6b7280;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Manage Appointments</h1>
  <div class="flex-container">
    <div class="box" id="pendingAppointmentsBox">
      <h2>Pending Appointments</h2>
      <div id="pendingAppointmentsList"></div>
      <p class="no-appointments" id="noPending" style="display:none;">No pending appointments.</p>
    </div>
    <div class="box" id="approvedAppointmentsBox">
      <h2>Approved Appointments</h2>
      <div id="approvedAppointmentsList"></div>
      <p class="no-appointments" id="noApproved" style="display:none;">No approved appointments.</p>
    </div>
  </div>

  <hr style="margin: 40px 0;" />

  <div class="box" id="approvalPanel" style="display:none;">
    <h2>Approve Appointment</h2>
    <div id="selectedAppointmentDetails"></div>

    <label for="departmentSelect">Select Department:</label>
    <select id="departmentSelect" disabled>
      <option value="">Select department</option>
    </select>

    <label for="wardSelect">Select Ward:</label>
    <select id="wardSelect" disabled>
      <option value="">Select ward</option>
    </select>

    <label>Available Doctors:</label>
    <div id="doctorList" class="doctor-list">
      <p style="color:#888;">Select department and ward to see doctors.</p>
    </div>

    <button id="approveBtn" disabled>Approve Appointment</button>
  </div>

  <script src="doctors.js"></script>
  <script>
    // Load appointments from localStorage
    let appointments = JSON.parse(localStorage.getItem("appointments")) || [];

    // DOM Elements
    const pendingList = document.getElementById('pendingAppointmentsList');
    const approvedList = document.getElementById('approvedAppointmentsList');
    const noPending = document.getElementById('noPending');
    const noApproved = document.getElementById('noApproved');
    const approvalPanel = document.getElementById('approvalPanel');
    const selectedDetails = document.getElementById('selectedAppointmentDetails');
    const departmentSelect = document.getElementById('departmentSelect');
    const wardSelect = document.getElementById('wardSelect');
    const doctorList = document.getElementById('doctorList');
    const approveBtn = document.getElementById('approveBtn');

    let selectedAppointmentIndex = null;
    let selectedDoctor = null;

    // Utility: get unique departments and wards from appointments
    function getDepartmentsAndWards() {
      const departments = new Set();
      const wards = new Set();
      appointments.forEach(a => {
        if(a.department) departments.add(a.department);
        if(a.ward) wards.add(a.ward);
      });
      return {
        departments: Array.from(departments).sort(),
        wards: Array.from(wards).sort()
      };
    }

    // Render pending and approved appointments
    function renderAppointments() {
      pendingList.innerHTML = '';
      approvedList.innerHTML = '';
      const pending = appointments.filter(a => !a.doctor);
      const approved = appointments.filter(a => a.doctor);

      if (pending.length === 0) {
        noPending.style.display = 'block';
      } else {
        noPending.style.display = 'none';
        pending.forEach((appt, i) => {
          const div = document.createElement('div');
          div.className = 'appointment-card';
          div.dataset.index = appointments.indexOf(appt);
          div.innerHTML = `
            <div class="appointment-header">#${appointments.indexOf(appt) + 1} - ${appt.name}</div>
            <div><strong>Date:</strong> ${appt.date}</div>
            <div><strong>Department:</strong> ${appt.department}</div>
            <div><strong>Ward:</strong> ${appt.ward}</div>
          `;
          pendingList.appendChild(div);
        });
      }

      if (approved.length === 0) {
        noApproved.style.display = 'block';
      } else {
        noApproved.style.display = 'none';
        approved.forEach((appt) => {
          const div = document.createElement('div');
          div.className = 'appointment-card approved';
          div.innerHTML = `
            <div class="appointment-header">#${appointments.indexOf(appt) + 1} - ${appt.name}</div>
            <div><strong>Date:</strong> ${appt.date}</div>
            <div><strong>Department:</strong> ${appt.department}</div>
            <div><strong>Ward:</strong> ${appt.ward}</div>
            <div><strong>Doctor:</strong> ${appt.doctor.name}</div>
          `;
          approvedList.appendChild(div);
        });
      }
    }

    // Fill department select options
    function populateDepartmentSelect() {
      const {departments} = getDepartmentsAndWards();
      departmentSelect.innerHTML = '<option value="">Select department</option>';
      departments.forEach(dep => {
        const opt = document.createElement('option');
        opt.value = dep;
        opt.textContent = dep;
        departmentSelect.appendChild(opt);
      });
      departmentSelect.disabled = false;
    }

    // Fill ward select options filtered by department
    function populateWardSelect(department) {
      const wards = new Set();
      appointments.forEach(a => {
        if(a.department === department && a.ward) wards.add(a.ward);
      });
      wardSelect.innerHTML = '<option value="">Select ward</option>';
      Array.from(wards).sort().forEach(w => {
        const opt = document.createElement('option');
        opt.value = w;
        opt.textContent = w;
        wardSelect.appendChild(opt);
      });
      wardSelect.disabled = false;
    }

    // Show doctors matching selected department and ward
    function showDoctors(department, ward) {
      doctorList.innerHTML = '';
      selectedDoctor = null;
      approveBtn.disabled = true;

      const filteredDoctors = doctors.filter(doc => doc.department === department && doc.ward === ward);

      if (filteredDoctors.length === 0) {
        doctorList.innerHTML = '<p style="color:#888;">No doctors found for this department and ward.</p>';
        return;
      }

      filteredDoctors.forEach((doc, idx) => {
        const div = document.createElement('div');
        div.className = 'doctor-item';
        div.textContent = `${doc.name} (${doc.qualification}) - ${doc.specialization}`;
        div.dataset.index = idx;
        div.addEventListener('click', () => {
          // Deselect all
          doctorList.querySelectorAll('.doctor-item').forEach(d => d.classList.remove('selected'));
          div.classList.add('selected');
          selectedDoctor = doc;
          approveBtn.disabled = false;
        });
        doctorList.appendChild(div);
      });
    }

    // When an appointment card is clicked in pending list
    pendingList.addEventListener('click', e => {
      let card = e.target.closest('.appointment-card');
      if (!card) return;
      selectedAppointmentIndex = parseInt(card.dataset.index);
      const appt = appointments[selectedAppointmentIndex];
      approvalPanel.style.display = 'block';
      selectedDetails.innerHTML = `
        <p><strong>Name:</strong> ${appt.name}</p>
        <p><strong>Date:</strong> ${appt.date}</p>
        <p><strong>Problem:</strong> ${appt.problem || 'N/A'}</p>
      `;

      // Populate department and ward selects based on this appointment
      populateDepartmentSelect();
      departmentSelect.value = appt.department || '';
      populateWardSelect(departmentSelect.value);
      wardSelect.value = appt.ward || '';

      // Show doctors for current selections
      if(departmentSelect.value && wardSelect.value){
        showDoctors(departmentSelect.value, wardSelect.value);
      } else {
        doctorList.innerHTML = '<p style="color:#888;">Select department and ward to see doctors.</p>';
      }
      approveBtn.disabled = true;
      selectedDoctor = null;
    });

    // Update wards when department changes
    departmentSelect.addEventListener('change', () => {
      populateWardSelect(departmentSelect.value);
      wardSelect.value = '';
      doctorList.innerHTML = '<p style="color:#888;">Select ward to see doctors.</p>';
      approveBtn.disabled = true;
      selectedDoctor = null;
    });

    // Update doctors when ward changes
    wardSelect.addEventListener('change', () => {
      if(departmentSelect.value && wardSelect.value){
        showDoctors(departmentSelect.value, wardSelect.value);
      } else {
        doctorList.innerHTML = '<p style="color:#888;">Select department and ward to see doctors.</p>';
      }
      approveBtn.disabled = true;
      selectedDoctor = null;
    });

    // Approve button click: assign doctor and update appointment
    approveBtn.addEventListener('click', () => {
      if(selectedAppointmentIndex === null || !selectedDoctor) return;

      // Update appointment
      appointments[selectedAppointmentIndex].doctor = selectedDoctor;
      appointments[selectedAppointmentIndex].department = departmentSelect.value;
      appointments[selectedAppointmentIndex].ward = wardSelect.value;

      // Save back to localStorage
      localStorage.setItem('appointments', JSON.stringify(appointments));

      // Refresh UI
      approvalPanel.style.display = 'none';
      selectedAppointmentIndex = null;
      selectedDoctor = null;
      renderAppointments();

      alert('Appointment approved with doctor assigned!');
    });

    // Initial render
    renderAppointments();
  </script>
</body>
</html>
