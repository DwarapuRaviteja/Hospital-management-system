<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Appointments - Admin</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #dbeafe, #f0f9ff);
      margin: 0;
      padding: 30px;
      color: #1e3a8a;
    }
    .container {
      max-width: 1000px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      animation: fadeIn 0.6s ease;
    }
    h1 { text-align: center; margin-bottom: 20px; color: #1e40af; }

    /* Tabs */
    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px 8px 0 0;
      background: #e0e7ff;
      color: #1e3a8a;
      transition: all 0.3s;
    }
    .tab-btn.active {
      background: #2563eb;
      color: #fff;
    }

    /* Sections */
    .section { display: none; }
    .section.active { display: block; animation: fadeIn 0.5s ease; }

    /* Cards */
    .appointment, .doctor-card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      background: #f9fafb;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s;
    }
    .appointment:hover, .doctor-card:hover { transform: scale(1.02); }
    .appointment h3 { margin: 0 0 8px; color: #2563eb; }

    /* Buttons */
    .approve-btn, .assign-btn, .back-btn {
      background: #2563eb;
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 8px;
    }
    .approve-btn:hover, .assign-btn:hover { background: #1e40af; }
    .back-btn {
      background: #6b7280;
      margin-top: 15px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Appointments Management</h1>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('pending')">Pending</button>
      <button class="tab-btn" onclick="switchTab('approved')">Approved</button>
    </div>

    <!-- Pending Section -->
    <div id="pending" class="section active">
      <h2>Pending Appointments</h2>
      <div id="appointmentsList"></div>
      <div id="doctorsList" class="hidden"></div>
      <button class="back-btn" onclick="goBack()">⬅ Back</button>
    </div>

    <!-- Approved Section -->
    <div id="approved" class="section">
      <h2>Approved Appointments</h2>
      <div id="approvedList"></div>
    </div>
  </div>

  <script>
    let appointments = JSON.parse(localStorage.getItem("appointments")) || [];
    const apptList = document.getElementById("appointmentsList");
    const docList = document.getElementById("doctorsList");
    const approvedList = document.getElementById("approvedList");

    // Doctor data with full info
    const doctors = {
      "Orthopedics": [
        "Dr. Krishna - MBBS, MS (Orthopedics) – Joint replacement & fracture management specialist.",
        "Dr. Anjali - MBBS, D.Ortho – Expert in sports injuries and arthritis care."
      ],
      "Neurology": [
        "Dr. Ramesh - MBBS, DM (Neurology) – Stroke and epilepsy specialist.",
        "Dr. Meera - MBBS, MD (Neuro) – Dementia and Parkinson's disease specialist."
      ],
      "Cardiology": [
        "Dr. Rajesh - MBBS, DM (Cardiology) – Expert in angioplasty and bypass surgery.",
        "Dr. Kavita - MBBS, MD – Specialist in arrhythmia and hypertension."
      ],
      "ENT": [
        "Dr. Sameer - MBBS, MS (ENT) – Specialist in sinus and ear surgeries.",
        "Dr. Priya - MBBS, MS – Expert in hearing disorders and allergy care."
      ],
      "Dermatology": [
        "Dr. Neha - MBBS, MD (Dermatology) – Specialist in acne and skin rejuvenation.",
        "Dr. Arjun - MBBS, MD – Expert in psoriasis and cosmetic dermatology."
      ],
      "Gynecology": [
        "Dr. Lakshmi - MBBS, MD (Gynecology) – Infertility and maternity care specialist.",
        "Dr. Divya - MBBS, DGO – Menstrual disorder and preventive women's health expert."
      ],
      "Oncology": [
        "Dr. Sanjay - MBBS, DM (Oncology) – Chemotherapy & radiation specialist.",
        "Dr. Bhaskar - MBBS, MD – Immunotherapy & palliative care specialist."
      ],
      "Nephrology": [
        "Dr. Mohan - MBBS, DM (Nephrology) – Kidney transplant and dialysis specialist.",
        "Dr. Sneha - MBBS, MD – Expert in chronic kidney disease management."
      ],
"General": [
  "Dr. Rishi - MBBS, MD (Internal Medicine) – Specialist in fever, infections, and general health check-ups.",
  "Dr. Sadhvik - MBBS, DNB (General Medicine) – Expert in hypertension, diabetes, and common ailments."
]

    };

    // Switch tab
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

      document.querySelector(`[onclick="switchTab('${tabId}')"]`).classList.add('active');
      document.getElementById(tabId).classList.add('active');

      if (tabId === "pending") showAppointments();
      if (tabId === "approved") showApproved();
    }
function approveAppointment(index, doctor) {
  let appointments = JSON.parse(localStorage.getItem("appointments")) || [];

  // attach doctor info to this appointment
  appointments[index].status = "approved";
  appointments[index].doctor = {
    name: doctor.name,
    qualification: doctor.qualification,
    specialization: doctor.specialization
  };

  localStorage.setItem("appointments", JSON.stringify(appointments));
  alert("Appointment approved!");
}

    // Show pending
    function showAppointments() {
      apptList.innerHTML = "";
      docList.innerHTML = "";
      docList.classList.add("hidden");
      apptList.classList.remove("hidden");

      let found = false;
      appointments.forEach((appt, index) => {
        if (!appt.doctor) {
          found = true;
          const div = document.createElement("div");
          div.className = "appointment";
          div.innerHTML = `
            <h3>${appt.name} - ${appt.department}</h3>
            <p><b>Date:</b> ${appt.date} | <b>Slot:</b> ${appt.slot}</p>
            <button class="approve-btn" onclick="selectDept(${index}, '${appt.department}')">Approve</button>
          `;
          apptList.appendChild(div);
        }
      });
      if (!found) apptList.innerHTML = "<p>No pending appointments.</p>";
    }

    // Approve → show doctors
    function selectDept(index, dept) {
      localStorage.setItem("pendingIndex", index);
      showDoctors(dept);
    }

    function showDoctors(dept) {
      apptList.classList.add("hidden");
      docList.classList.remove("hidden");
      docList.innerHTML = "";

      if (!doctors[dept]) {
        docList.innerHTML = "<p>No doctors available for this department.</p>";
        return;
      }

      doctors[dept].forEach(d => {
        const div = document.createElement("div");
        div.className = "doctor-card";
        const docName = d.split(" - ")[0];
        div.innerHTML = `
          <strong>${d}</strong><br>
          <button class="assign-btn" onclick="assignDoctor('${docName}')">Assign</button>
        `;
        docList.appendChild(div);
      });
    }

    function assignDoctor(doctorName) {
      let index = localStorage.getItem("pendingIndex");
      if (appointments[index]) {
        appointments[index].doctor = doctorName;
        localStorage.setItem("appointments", JSON.stringify(appointments));
        localStorage.removeItem("pendingIndex");
        alert("Doctor assigned successfully!");
        showAppointments();
      }
    }

    // Approved list
    function showApproved() {
      approvedList.innerHTML = "";
      let found = false;
      appointments.forEach(appt => {
        if (appt.doctor) {
          found = true;
          const div = document.createElement("div");
          div.className = "appointment";
          div.innerHTML = `
            <h3>${appt.name} - ${appt.department}</h3>
            <p><b>Date:</b> ${appt.date} | <b>Slot:</b> ${appt.slot}</p>
            <p><b>Assigned Doctor:</b> ${appt.doctor}</p>
          `;
          approvedList.appendChild(div);
        }
      });
      if (!found) approvedList.innerHTML = "<p>No approved appointments yet.</p>";
    }

    // Back button
    function goBack() {
      if (!apptList.classList.contains("hidden")) {
        window.location.href = "dashboard.html";
      } else {
        showAppointments();
      }
    }

    // Initial load
    showAppointments();
  </script>
</body>
</html>
