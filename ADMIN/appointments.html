<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Appointments - City Care Hospital</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    h1 {
      color: #1e3a8a;
      margin-bottom: 20px;
    }

    .container {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 1200px;
      margin-bottom: 20px;
    }
    .column {
      flex: 1;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 15px;
      min-height: 400px;
      cursor: pointer;
      transition: background-color 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .column.active {
      background-color: #e0f2fe;
      border: 2px solid #2563eb;
      cursor: default;
    }
    .column h2 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #2563eb;
    }

    .appointment-list {
      width: 100%;
      overflow-y: auto;
      max-height: 350px;
      border-top: 1px solid #ddd;
      padding-top: 10px;
    }
    .appointment-item {
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      background: #f9fafb;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .appointment-item.selected {
      background-color: #bfdbfe;
      border-color: #2563eb;
    }

    /* Center info box */
    .details-container {
      width: 100%;
      max-width: 600px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 20px;
      margin-bottom: 40px;
      min-height: 250px;
    }
    .details-container h3 {
      margin-top: 0;
      color: #1e3a8a;
    }
    .details-row {
      margin-bottom: 10px;
    }
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }
    select, button {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
      box-sizing: border-box;
      cursor: pointer;
    }
    select:disabled {
      background: #eee;
      cursor: not-allowed;
    }
    button {
      background-color: #444444;
      color: white;
      border: none;
      margin-top: 15px;
      transition: background-color 0.3s, box-shadow 0.3s;
    }
    button.glow {
      background-color: #16a34a;
      box-shadow: 0 0 12px #16a34a;
    }
    button:disabled {
      background-color: #999999;
      cursor: not-allowed;
      box-shadow: none;
    }

  </style>
</head>
<body>

  <h1>🩺 Manage Appointments</h1>

  <div class="container">
    <div id="pendingColumn" class="column active">
      <h2>Pending Appointments</h2>
      <div id="pendingList" class="appointment-list"></div>
    </div>

    <div id="approvedColumn" class="column">
      <h2>Approved Appointments</h2>
      <div id="approvedList" class="appointment-list"></div>
    </div>
  </div>

  <div id="details" class="details-container" style="display:none;">
    <h3>Appointment Details</h3>
    <div><strong>Patient Name:</strong> <span id="detailName"></span></div>
    <div><strong>Department:</strong> <span id="detailDepartment"></span></div>
    <div><strong>Date:</strong> <span id="detailDate"></span></div>
    <div id="assignDoctorSection" style="margin-top: 15px;">
      <div class="details-row">
        <label for="departmentDropdown">Select Department</label>
        <select id="departmentDropdown"></select>
      </div>
      <div class="details-row">
        <label for="doctorDropdown">Select Doctor <button id="addDoctorBtn" title="Assign doctor" style="margin-left: 5px; cursor:pointer;">➕</button></label>
        <select id="doctorDropdown" disabled></select>
      </div>
      <button id="approveBtn" disabled>Approve Appointment</button>
    </div>
    <div id="approvedDoctorInfo" style="margin-top: 15px; font-style: italic; color: #16a34a; display:none;">
      Approved Doctor: <span id="approvedDoctorName"></span>
    </div>
  </div>

  <script>
    // Doctor data as provided
    const doctors = {
      "Orthopedics": [
        "Dr. Krishna - MBBS, MS (Orthopedics) – Joint replacement & fracture management specialist.",
        "Dr. Anjali - MBBS, D.Ortho – Expert in sports injuries and arthritis care."
      ],
      "Neurology": [
        "Dr. Ramesh - MBBS, DM (Neurology) – Stroke and epilepsy specialist.",
        "Dr. Meera - MBBS, MD (Neuro) – Dementia and Parkinson's disease specialist."
      ],
      "Cardiology": [
        "Dr. Rajesh - MBBS, DM (Cardiology) – Expert in angioplasty and bypass surgery.",
        "Dr. Kavita - MBBS, MD – Specialist in arrhythmia and hypertension."
      ],
      "ENT": [
        "Dr. Sameer - MBBS, MS (ENT) – Specialist in sinus and ear surgeries.",
        "Dr. Priya - MBBS, MS – Expert in hearing disorders and allergy care."
      ],
      "Dermatology": [
        "Dr. Neha - MBBS, MD (Dermatology) – Specialist in acne and skin rejuvenation.",
        "Dr. Arjun - MBBS, MD – Expert in psoriasis and cosmetic dermatology."
      ],
      "Gynecology": [
        "Dr. Lakshmi - MBBS, MD (Gynecology) – Infertility and maternity care specialist.",
        "Dr. Divya - MBBS, DGO – Menstrual disorder and preventive women's health expert."
      ],
      "Oncology": [
        "Dr. Sanjay - MBBS, DM (Oncology) – Chemotherapy & radiation specialist.",
        "Dr. Bhaskar - MBBS, MD – Immunotherapy & palliative care specialist."
      ],
      "Nephrology": [
        "Dr. Mohan - MBBS, DM (Nephrology) – Kidney transplant and dialysis specialist.",
        "Dr. Sneha - MBBS, MD – Expert in chronic kidney disease management."
      ],
      "General": [
        "Dr. Rishi - MBBS, MD (Internal Medicine) – Specialist in fever, infections, and general health check-ups.",
        "Dr. Sadhvik - MBBS, DNB (General Medicine) – Expert in hypertension, diabetes, and common ailments."
      ]
    };

    // Elements
    const pendingListEl = document.getElementById('pendingList');
    const approvedListEl = document.getElementById('approvedList');
    const detailsEl = document.getElementById('details');

    const detailNameEl = document.getElementById('detailName');
    const detailDepartmentEl = document.getElementById('detailDepartment');
    const detailDateEl = document.getElementById('detailDate');

    const departmentDropdown = document.getElementById('departmentDropdown');
    const doctorDropdown = document.getElementById('doctorDropdown');
    const addDoctorBtn = document.getElementById('addDoctorBtn');
    const approveBtn = document.getElementById('approveBtn');

    const approvedDoctorInfo = document.getElementById('approvedDoctorInfo');
    const approvedDoctorName = document.getElementById('approvedDoctorName');

    const pendingColumn = document.getElementById('pendingColumn');
    const approvedColumn = document.getElementById('approvedColumn');

    // Load appointments from localStorage
    let pendingAppointments = JSON.parse(localStorage.getItem('pendingAppointments')) || [];
    let approvedAppointments = JSON.parse(localStorage.getItem('approvedAppointments')) || [];

    let selectedAppointment = null;
    let currentView = 'pending'; // 'pending' or 'approved'

    // Populate department dropdown
    function populateDepartments(selectedDept = null) {
      departmentDropdown.innerHTML = '';
      const deptNames = Object.keys(doctors);
      deptNames.forEach(dept => {
        const option = document.createElement('option');
        option.value = dept;
        option.textContent = dept;
        if (dept === selectedDept) option.selected = true;
        departmentDropdown.appendChild(option);
      });
    }

    // Populate doctors dropdown based on selected department
    function populateDoctors(department, selectedDoctor = null) {
      doctorDropdown.innerHTML = '';
      if (!department || !doctors[department]) {
        doctorDropdown.disabled = true;
        return;
      }
      doctorDropdown.disabled = false;
      doctors[department].forEach(doc => {
        const option = document.createElement('option');
        option.value = doc;
        option.textContent = doc;
        if (doc === selectedDoctor) option.selected = true;
        doctorDropdown.appendChild(option);
      });
    }

    // Render appointments list in the side column
    function renderAppointments() {
      pendingListEl.innerHTML = '';
      approvedListEl.innerHTML = '';

      pendingAppointments.forEach(app => {
        const div = document.createElement('div');
        div.classList.add('appointment-item');
        if (selectedAppointment && selectedAppointment.id === app.id) {
          div.classList.add('selected');
        }
        div.textContent = `${app.patientName} — ${app.department} — ${app.date}`;
        div.title = `Patient: ${app.patientName}\nDepartment: ${app.department}\nDate: ${app.date}`;
        div.onclick = () => selectAppointment(app, 'pending');
        pendingListEl.appendChild(div);
      });

      approvedAppointments.forEach(app => {
        const div = document.createElement('div');
        div.classList.add('appointment-item');
        if (selectedAppointment && selectedAppointment.id === app.id) {
          div.classList.add('selected');
        }
        div.textContent = `${app.patientName} — ${app.department} — ${app.date} — Dr: ${app.doctor || 'N/A'}`;
        div.title = `Patient: ${app.patientName}\nDepartment: ${app.department}\nDate: ${app.date}\nDoctor: ${app.doctor || 'N/A'}`;
        div.onclick = () => selectAppointment(app, 'approved');
        approvedListEl.appendChild(div);
      });
    }

    // Show appointment details in center
    function selectAppointment(app, view) {
      selectedAppointment = app;
      currentView = view;

      // Highlight columns
      if(view === 'pending') {
        pendingColumn.classList.add('active');
        approvedColumn.classList.remove('active');
      } else {
        approvedColumn.classList.add('active');
        pendingColumn.classList.remove('active');
      }

      renderAppointments();

      detailNameEl.textContent = app.patientName;
      detailDepartmentEl.textContent = app.department;
      detailDateEl.textContent = app.date;

      if(view === 'pending') {
        // Show assign doctor section
        detailsEl.style.display = 'block';
        approvedDoctorInfo.style.display = 'none';

        populateDepartments(app.department);
        populateDoctors(app.department, app.doctor || null);

        // Enable or disable controls based on doctor assignment
        if(app.doctor) {
          doctorDropdown.value = app.doctor;
          approveBtn.disabled = false;
          approveBtn.classList.add('glow');
        } else {
          doctorDropdown.value = '';
          approveBtn.disabled = true;
          approveBtn.classList.remove('glow');
        }
      } else {
        // Approved appointment: show doctor info only, hide assign section
        detailsEl.style.display = 'block';
        approvedDoctorInfo.style.display = 'block';
        approvedDoctorName.textContent = app.doctor || 'Not assigned';
        approveBtn.disabled = true;
        approveBtn.classList.remove('glow');

        // Disable dropdowns
        departmentDropdown.innerHTML = '';
        doctorDropdown.innerHTML = '';
        doctorDropdown.disabled = true;
      }
    }

    // Update doctor dropdown when department changes
    departmentDropdown.addEventListener('change', () => {
      const dept = departmentDropdown.value;
      populateDoctors(dept);
      doctorDropdown.value = '';
      approveBtn.disabled = true;
      approveBtn.classList.remove('glow');

      // Update selected appointment's department
      if (selectedAppointment) {
        selectedAppointment.department = dept;
        detailDepartmentEl.textContent = dept;
      }
    });

    // Enable approve button only if doctor selected
    doctorDropdown.addEventListener('change', () => {
      if (doctorDropdown.value) {
        approveBtn.disabled = false;
        approveBtn.classList.add('glow');

        if(selectedAppointment) {
          selectedAppointment.doctor = doctorDropdown.value;
        }
      } else {
        approveBtn.disabled = true;
        approveBtn.classList.remove('glow');

        if(selectedAppointment) {
          selectedAppointment.doctor = null;
        }
      }
    });

    // Assign doctor button (+) fills doctor dropdown with first doctor of selected department (for convenience)
    addDoctorBtn.addEventListener('click', () => {
      const dept = departmentDropdown.value;
      if (!dept || !doctors[dept]) return;
      doctorDropdown.value = doctors[dept][0];
      approveBtn.disabled = false;
      approveBtn.classList.add('glow');

      if(selectedAppointment) {
        selectedAppointment.doctor = doctorDropdown.value;
      }
    });

    // Approve appointment
    approveBtn.addEventListener('click', () => {
      if(!selectedAppointment || !selectedAppointment.doctor) {
        alert('Please assign a doctor before approving.');
        return;
      }

      // Remove from pending
      pendingAppointments = pendingAppointments.filter(a => a.id !== selectedAppointment.id);
      // Add to approved
      approvedAppointments.push(selectedAppointment);

      // Save to localStorage
      localStorage.setItem('pendingAppointments', JSON.stringify(pendingAppointments));
      localStorage.setItem('approvedAppointments', JSON.stringify(approvedAppointments));

      alert(`Appointment for ${selectedAppointment.patientName} approved with ${selectedAppointment.doctor}.`);

      selectedAppointment = null;
      detailsEl.style.display = 'none';
      renderAppointments();

      // Default to pending view and no selection
      pendingColumn.classList.add('active');
      approvedColumn.classList.remove('active');
    });

    // Column click toggles view and clears selection
    pendingColumn.addEventListener('click', () => {
      if(currentView !== 'pending') {
        currentView = 'pending';
        selectedAppointment = null;
        detailsEl.style.display = 'none';
        pendingColumn.classList.add('active');
        approvedColumn.classList.remove('active');
        renderAppointments();
      }
    });
    approvedColumn.addEventListener('click', () => {
      if(currentView !== 'approved') {
        currentView = 'approved';
        selectedAppointment = null;
        detailsEl.style.display = 'none';
        approvedColumn.classList.add('active');
        pendingColumn.classList.remove('active');
        renderAppointments();
      }
    });

    // Initial render
    renderAppointments();

  </script>
</body>
</html>
