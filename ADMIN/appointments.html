<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Appointments - Admin</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 40px;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; color: #1e3a8a; }
    .appointment {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      background: #fafafa;
    }
    .appointment h3 { margin: 0 0 8px; color: #2563eb; }
    .approve-btn {
      background: #2ecc71;
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }
    .approve-btn:hover { background: #27ae60; }
    .back-btn {
      margin-top: 20px;
      background: #bbb;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pending Appointments</h1>
    <div id="appointmentsList"></div>
    <button class="back-btn" onclick="window.location.href='dashboard.html'">⬅ Back to Dashboard</button>
  </div>

  <script>
    let appointments = JSON.parse(localStorage.getItem("appointments")) || [];
    const list = document.getElementById("appointmentsList");

    if (appointments.length === 0) {
      list.innerHTML = "<p>No appointments yet.</p>";
    } else {
      appointments.forEach((appt, index) => {
        // only show if doctor not yet assigned
        if (!appt.doctor) {
          const div = document.createElement("div");
          div.className = "appointment";
          div.innerHTML = `
            <h3>${appt.name} - ${appt.department}</h3>
            <p><b>Date:</b> ${appt.date} | <b>Slot:</b> ${appt.slot}</p>
            <button class="approve-btn" onclick="approve(${index}, '${appt.department}')">Approve</button>
          `;
          list.appendChild(div);
        }
      });
    }

    function approve(index, dept) {
      // Save index and dept temporarily
      localStorage.setItem("pendingIndex", index);
      localStorage.setItem("pendingDept", dept);
      // Redirect admin to doctors page (root folder)
      window.location.href = "../doctors.html";
    }
  </script>
</body>
</html>
