<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RS Hospitals - Admin Login</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #4e73df, #1cc88a);
      overflow: hidden;
    }

    /* Stylish heading */
    .title {
      position: absolute;
      top: 30px;
      font-size: 32px;
      font-weight: bold;
      color: #fff;
      text-align: center;
      width: 100%;
      animation: fadeSlide 2s ease-in-out;
      font-family: 'Trebuchet MS', sans-serif;
      letter-spacing: 2px;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      width: 320px;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    .login-container h2 {
      margin-bottom: 20px;
      color: #4e73df;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      transition: border 0.3s;
    }

    .form-group input:focus {
      border-color: #4e73df;
    }

    .btn {
      background: #4e73df;
      color: #fff;
      padding: 10px;
      border: none;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #2e59d9;
    }

    .error {
      color: red;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Notification panel */
    .notification {
      position: fixed;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      background: #1cc88a;
      color: #fff;
      padding: 15px 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      font-weight: bold;
      transition: top 0.6s ease-in-out;
      z-index: 1000;
    }

    .notification.show {
      top: 20px;
    }
  </style>
</head>
<body>
  <div class="title">RS HOSPITALS</div>

  <div class="login-container">
    <h2>Admin Login</h2>
    <form id="adminLoginForm">
      <div class="form-group">
        <label for="adminId">Admin ID</label>
        <input type="text" id="adminId" placeholder="Enter Admin ID" required>
      </div>
      <div class="form-group">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" placeholder="Enter Password" required>
      </div>
      <button type="submit" class="btn">Login</button>
      <p class="error" id="errorMsg">Invalid Admin ID or Password</p>
    </form>
  </div>

  <!-- Notification Panel -->
  <div id="notification" class="notification">✅ Login Successful! Redirecting...</div>

  <script>
    document.getElementById("adminLoginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const adminId = document.getElementById("adminId").value;
      const adminPassword = document.getElementById("adminPassword").value;
      const errorMsg = document.getElementById("errorMsg");
      const notification = document.getElementById("notification");

      if (adminId === "ADMIN0001" && adminPassword === "@dmin0001") {
        errorMsg.style.display = "none";
        notification.classList.add("show");

        setTimeout(() => {
          notification.classList.remove("show");
          window.location.href = "dashboard.html"; // Redirect to dashboard
        }, 2500);
      } else {
        errorMsg.style.display = "block";
      }
    });
  </script>
</body>
</html>
