<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - City Care Hospital</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #1e3a8a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Hospital Name Heading */
    .header {
      text-align: center;
      margin: 25px 0 10px 0;
    }
    .header h1 {
      font-size: 2.8rem;
      font-weight: 700;
      font-family: 'Georgia', serif;
      color: #2563eb;
      margin: 0;
    }

    /* Menu Icon Button */
    .menu-btn {
      position: absolute;
      top: 70px;
      left: 20px;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.2rem;
      z-index: 1100;
      transition: background 0.3s, opacity 0.3s;
    }
    .menu-btn:hover {
      background: #1d4ed8;
    }
    .menu-btn.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Sidebar (Menu Drawer) */
    .sidebar {
      position: fixed;
      top: 0;
      left: -100%;
      width: 260px;
      height: 100%;
      background: #2563eb;
      color: white;
      padding: 25px;
      box-shadow: 2px 0 12px rgba(0,0,0,0.2);
      transition: left 0.35s ease-in-out;
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }
    .sidebar.active { left: 0; }
    .sidebar h2 {
      margin-top: 0;
      font-size: 1.4rem;
      margin-bottom: 20px;
    }
    .sidebar a {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      margin: 12px 0;
      transition: color 0.3s;
    }
    .sidebar a:hover { color: #dbeafe; }

    /* Close button inside sidebar */
    .close-btn {
      align-self: flex-end;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: white;
      cursor: pointer;
      margin-bottom: 20px;
      transition: color 0.3s;
    }
    .close-btn:hover {
      color: #dbeafe;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      display: none;
      z-index: 900;
    }
    .overlay.active { display: block; }

    /* Body content */
    .content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      text-align: center;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 16px 28px;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      min-width: 200px;
    }
    .btn:hover {
      background: #1d4ed8;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <h1>🏥 City Care Hospital</h1>
  </div>

  <!-- Menu Button (symbol only) -->
  <button class="menu-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>

  <!-- Sidebar Menu -->
  <div class="sidebar" id="sidebar">
    <button class="close-btn" onclick="closeMenu()"><i class="fa-solid fa-xmark"></i></button>
    <h2>Menu</h2>
    <a href="users.html"><i class="fa-solid fa-users"></i> Users Information</a>
    <a href="wallet.html"><i class="fa-solid fa-wallet"></i> Wallet Management</a>
    <a href="schedule.html"><i class="fa-solid fa-calendar-days"></i> Schedule</a>
    <a href="../login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </div>

  <!-- Overlay -->
  <div class="overlay" id="overlay" onclick="closeMenu()"></div>

  <!-- Content -->
  <div class="content">
    <button class="btn" onclick="location.href='appointment.html'"><i class="fa-solid fa-calendar-check"></i> Appointments</button>
    <button class="btn" onclick="location.href='sendreport.html'"><i class="fa-solid fa-file-medical"></i> Send Reports</button>
<button class="btn" onclick="location.href='schedule.html'">
  <i class="fa-solid fa-calendar-days"></i> Manage Dates for Appointment
</button>
  </div>

  <script>
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const menuBtn = document.getElementById("menuBtn");

    function openMenu() {
      sidebar.classList.add("active");
      overlay.classList.add("active");
      menuBtn.classList.add("hidden"); // hide menu button
    }

    function closeMenu() {
      sidebar.classList.remove("active");
      overlay.classList.remove("active");
      menuBtn.classList.remove("hidden"); // show menu button again
    }

    menuBtn.addEventListener("click", openMenu);
  </script>
</body>
</html>
