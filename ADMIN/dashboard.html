<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - R S Hospital</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #1e3a8a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    /* Header */
    header {
      width: 100%;
      background: #2563eb;
      color: white;
      padding: 15px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header h1 {
      margin: 0;
      font-size: 20px;
    }
    .menu-btn {
      background: white;
      color: #2563eb;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }
    .menu-btn:hover {
      background: #f0f0f0;
    }

    /* Slide Menu */
    .menu {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100%;
      background: #f9fafb;
      box-shadow: 2px 0 10px rgba(0,0,0,0.2);
      padding: 20px;
      transition: left 0.3s ease;
      z-index: 1000;
    }
    .menu.active {
      left: 0;
    }
    .menu h2 {
      margin-top: 0;
      font-size: 1.3rem;
      color: #2563eb;
      margin-bottom: 20px;
    }
    .menu ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .menu ul li {
      margin: 15px 0;
    }
    .menu ul li a {
      text-decoration: none;
      font-size: 1rem;
      color: #1e3a8a;
      font-weight: 600;
      transition: color 0.3s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .menu ul li a:hover {
      color: #2563eb;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      display: none;
      z-index: 999;
    }
    .overlay.active {
      display: block;
    }

    /* Main body */
    .main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .main h1 {
      font-size: 2.2rem;
      margin-bottom: 30px;
      font-weight: 700;
    }
    .button-group {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn:hover {
      background: #1d4ed8;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <h1>Admin Dashboard</h1>
    <button class="menu-btn" onclick="toggleMenu()">☰ Menu</button>
  </header>

  <!-- Side Menu -->
  <div class="menu" id="menu">
    <h2>Menu</h2>
    <ul>
      <li><a href="users.html"><i class="fa-solid fa-users"></i> Users Information</a></li>
      <li><a href="wallet.html"><i class="fa-solid fa-wallet"></i> Wallet Management</a></li>
      <li><a href="schedule.html"><i class="fa-solid fa-calendar-days"></i> Schedule</a></li>
      <li><a href="../login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
    </ul>
  </div>
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <!-- Main Body -->
  <div class="main">
    <h1>🏥 R S Hospital</h1>
    <div class="button-group">
      <button class="btn" onclick="window.location.href='appointments.html'"><i class="fa-solid fa-calendar-check"></i> Appointments</button>
      <button class="btn" onclick="window.location.href='reports.html'"><i class="fa-solid fa-file-medical"></i> Send Reports</button>
    </div>
  </div>

  <script>
    const menu = document.getElementById("menu");
    const overlay = document.getElementById("overlay");

    function toggleMenu() {
      menu.classList.toggle("active");
      overlay.classList.toggle("active");
    }
  </script>
</body>
</html>
