<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Reports - City Care Hospitals</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .report-container {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      width: 400px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .report-container h2 {
      margin-bottom: 20px;
      color: #1d4ed8;
    }

    .report-card {
      margin-top: 15px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      text-align: left;
    }

    .report-card a {
      color: #1d4ed8;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="title">My Reports</div>

  <div class="report-container">
    <h2>Available Reports</h2>
    <div id="reportsList"></div>
  </div>

  <script>
    // Example: Simulate logged-in user
    const loggedInUser = "USER001"; // In real system, get from login session

    const reportData = localStorage.getItem("report_" + loggedInUser);
    const reportsList = document.getElementById("reportsList");

    if (reportData) {
      const report = JSON.parse(reportData);
      reportsList.innerHTML = `
        <div class="report-card">
          <p><strong>Report:</strong> ${report.fileName}</p>
          <p><strong>Uploaded:</strong> ${report.uploadedAt}</p>
          <a href="${report.fileUrl}" target="_blank">📂 View / Download</a>
        </div>
      `;
    } else {
      reportsList.innerHTML = "<p>No reports available yet.</p>";
    }
  </script>
</body>
</html>
