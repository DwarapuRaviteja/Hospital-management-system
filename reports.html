<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Reports - City Care Hospitals</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .report-container {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      width: 500px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      margin: 40px auto;
    }

    .report-container h2 {
      margin-bottom: 20px;
      color: #1d4ed8;
    }

    .report-card {
      margin-top: 15px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      text-align: left;
    }

    .report-card a {
      color: #1d4ed8;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="title">My Reports</div>

  <div class="report-container">
    <h2>Available Reports</h2>
    <div id="reportsList"></div>
  </div>

  <script>
    // Get logged-in user ID (set in profile.html after login)
    const loggedInUser = localStorage.getItem("loggedInUser");
    const reportsList = document.getElementById("reportsList");

    if (!loggedInUser) {
      reportsList.innerHTML = "<p>⚠️ Please log in from your Profile page first.</p>";
    } else {
      // Fetch reports linked with this user
      const reports = JSON.parse(localStorage.getItem("reports_" + loggedInUser)) || [];

      if (reports.length > 0) {
        reportsList.innerHTML = reports.map((report, index) => `
          <div class="report-card">
            <p><strong>Report ${index + 1}:</strong> ${report.fileName}</p>
            <p><strong>Uploaded:</strong> ${report.uploadedAt}</p>
            <a href="${report.fileUrl}" target="_blank">📂 View / Download</a>
          </div>
        `).join("");
      } else {
        reportsList.innerHTML = "<p>No reports available yet.</p>";
      }
    }
  </script>
</body>
</html>
