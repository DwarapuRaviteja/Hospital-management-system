<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reports - City Care Hospital</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #eef2ff; margin:0; padding:40px; display:flex; justify-content:center; }
    .container { max-width: 800px; width:100%; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(37,99,235,0.3); }
    h1 { text-align:center; color:#1e3a8a; margin-bottom:20px; }
    .report-card { background:#f9fafb; border-radius:10px; padding:18px 20px; margin-bottom:15px; border:1px solid #ccc; }
    .report-card h2 { margin:0 0 8px; font-size:1.2rem; color:#2563eb; }
    .report-card p { margin:4px 0; font-size:0.95rem; }
    .files-list li { margin-top:6px; }
    .download-btn { background:#2563eb; color:white; padding:6px 12px; border-radius:6px; text-decoration:none; font-size:0.9rem; }
    .download-btn:hover { background:#1e40af; }
    .no-reports { text-align:center; color:#6b7280; font-size:1.1rem; margin-top:30px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Reports</h1>
    <div id="reportsList"></div>
  </div>

  <script>
    // Current logged in user
    const currentUser = JSON.parse(localStorage.getItem("currentUser"));
    const reportsData = JSON.parse(localStorage.getItem("reports")) || {};
    const reportsList = document.getElementById("reportsList");

    if (!currentUser || !currentUser.email) {
      reportsList.innerHTML = `<p class="no-reports">⚠️ Please log in to view your reports.</p>`;
    } else {
      const userReports = reportsData[currentUser.email] || [];
      if (!userReports.length) {
        reportsList.innerHTML = `<p class="no-reports">No reports available yet.</p>`;
      } else {
        userReports.forEach((report, i) => {
          const div = document.createElement("div");
          div.className = "report-card";
          div.innerHTML = `
            <h2>Report #${i+1}</h2>
            <p><b>Doctor:</b> ${report.appointment?.doctor?.name || "N/A"}</p>
            <p><b>Date:</b> ${report.appointment.date}</p>
            <p><b>Ward:</b> ${report.appointment.ward}</p>
            <p><b>File:</b> ${report.filename}</p>
            <a href="${report.filedata}" download="${report.filename}" class="download-btn">⬇️ Download</a>
          `;
          reportsList.appendChild(div);
        });
      }
    }
  </script>
</body>
</html>
